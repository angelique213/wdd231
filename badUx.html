<!-- badUx.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Allows text characters to display correctly -->
  <meta charset="UTF-8">

  <!-- Makes the page responsive on phones and tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Helps search engines understand the page -->
  <meta
    name="description"
    content="An improved website demonstrating better user experience, accessibility, readability, and responsive design."
  >

  <!-- Title shown in the browser tab -->
  <title>Improved User Experience Website</title>

  <!-- Connects the CSS file -->
  <link rel="stylesheet" href="badUx.css">
</head>
<body>

  <!-- Top section of the page -->
  <header>
    <!-- Main page heading -->
    <h1>Welcome to Our Website</h1>

    <!-- Short intro paragraph -->
    <p class="intro">
      This page demonstrates how improving design choices can create a better
      user experience for visitors.
    </p>
  </header>

  <!-- Main page content -->
  <main>

    <!-- Main image -->
    <img
      src="https://byui-cit.github.io/learning-modules/img/ux-good.jpg"
      alt="Example of a good user experience website design"
      width="600"
      height="300"
      loading="lazy"
    >

    <!-- Information section -->
    <section>
      <h2>Helpful Information</h2>

      <ul>
        <li>This</li>
        <li>is</li>
        <li>a</li>
        <li>shorter</li>
        <li>list</li>
      </ul>

      <!-- Fake pagination for better UX -->
      <div class="pagination">
        <button type="button">Previous</button>
        <button type="button">Next</button>
      </div>
    </section>

    <!-- Form section -->
    <section>
      <h2>Join Our Newsletter</h2>

      <form>
        <!-- Label tells user what to enter -->
        <label for="name">Enter your name:</label>

        <!-- Text box for name -->
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Your name"
        >

        <!-- Submit button -->
        <button type="submit">Subscribe</button>
      </form>
    </section>

  </main>
</body>
</html>
